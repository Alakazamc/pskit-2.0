services:
  pskit:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pskit:pskit@postgres:5432/pskit
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pskit-artifacts
      S3_ACCESS_KEY: pskit
      S3_SECRET_KEY: pskit-password
      PSKIT_LEGACY_ROOT: /opt/pskit-legacy-missing
    ports:
      - "10706:10706"
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pskit
      POSTGRES_USER: pskit
      POSTGRES_PASSWORD: pskit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pskit
      MINIO_ROOT_PASSWORD: pskit-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
