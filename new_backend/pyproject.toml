[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pskit-research-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2", "httpx>=0.27", "pypdf>=6", "Pillow>=12.3,<13", "jsonschema>=4.23", "mcp>=1.26,<2", "psycopg[binary]>=3.2,<4", "psycopg_pool>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.10", "fpdf2>=2.8.5"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*", "pskit_compute*"]

[tool.setuptools.package-data]
"app.db.postgres_migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
