[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pskit-research-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2", "httpx>=0.27", "pypdf>=6", "jsonschema>=4.23", "mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.10", "fpdf2>=2.8.5"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
