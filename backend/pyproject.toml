[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pskit-backend"
version = "0.2.0"
description = "FastAPI backend for PSKit 2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "argon2-cffi",
  "qdrant-client",
  "langgraph",
  "langchain-core",
  "biopython",
  "numpy",
  "mcp==1.27.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/agent/orchestrator.py" = ["BLE001"]
"app/tasks/worker.py" = ["BLE001"]
"app/rag/qdrant_store.py" = ["BLE001"]
"app/rag/retriever.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.setuptools.packages.find]
include = ["app*"]
