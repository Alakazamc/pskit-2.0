[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pskit-backend"
version = "0.1.0"
description = "FastAPI backend for PSKit 2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "argon2-cffi",
  "celery",
  "redis",
  "qdrant-client",
  "boto3",
  "langgraph",
  "langchain-core",
  "biopython",
  "numpy",
  "python-multipart",
  "orjson",
  "structlog",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.setuptools.packages.find]
include = ["app*"]
