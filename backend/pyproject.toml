[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pskit-backend"
version = "0.3.0"
description = "FastAPI backend for PSKit 2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "argon2-cffi",
  "qdrant-client",
  "langgraph",
  "langchain-core",
  "biopython",
  "numpy",
  "mcp==1.28.1",
  "python-multipart",
  "orjson",
  "structlog",
  "cryptography>=46",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"app/agent/orchestrator.py" = ["BLE001"]
"app/tasks/worker.py" = ["BLE001"]
"app/rag/qdrant_store.py" = ["BLE001"]
"app/rag/retriever.py" = ["BLE001"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["app/harness/fixtures/"]

[tool.setuptools.packages.find]
include = ["app*"]
