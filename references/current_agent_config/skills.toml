[[skills]]
id = "all-round_skill"
name = "All-Round skill"
description = """
A skill that can combine multiple tools for complex user requests.\
Also applies for situations that a user asks for a specific tool like read_result_file.\
Example for complex tasks: user asks for splitting a complex and then annotating binding pairs or predicting binding sites on a specific chain.\
In this case, the agent should be able to combine tools like split_complex or split_pdb_by_chain with annotate_binding_pairs or predict_binding_sites in a logical workflow to achieve the user's goal.
Do not use all-round skill if the user's request can be fulfilled by other skills or if the user is asking for general information without a specific actionable request.\
Do not make unnecessary tool calls. For example, if the user already provides specific chain information and only wants binding site prediction, there is no need to call structure splitting tools.\
"""
workflow = [
    "Identify the multiple steps/tools needed to fulfill the user's request.",
    "Use the appropriate tools in a logical sequence to achieve the desired outcome.",
    "Summarize the results and guide the user through the combined workflow.",
]
allowed_tools = [
    "search_pdb",
    "fetch_pdb_info",
    "download_pdb_file",
    "split_complex",
    "split_pdb_by_chain",
    "annotate_binding_pairs",
    "calculate_contact_map",
    "predict_binding_sites",
    "extract_empirical_features",
    "predict_interaction",
    "run_alphafold3",
    "read_result_file",
    "remote_rna_expert__generate_rna_for_protein",
    "search_uniprot",
    "fetch_uniprot_entry",
    "search_rnacentral",
    "fetch_rnacentral_entry",
    "serpapi_search",
]

