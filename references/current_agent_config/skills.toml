[[skills]]
id = "alphafold3_structure_prediction"
name = "AlphaFold 3 Structure Prediction"
description = "Run AlphaFold 3 from protein sequence input and summarize the generated structure files or runtime logs."
workflow = [
    "Use run_alphafold3 with one or more protein_sequences when the user explicitly requests structure prediction from sequence.",
    "Warn briefly that AF3 is a heavy job and may take time or wait for a worker slot.",
    "After the tool finishes, summarize the main generated files and point the user to af3_stdout.log or af3_stderr.log when troubleshooting is needed.",
    "Use read_result_file on AF3 logs only when the user asks for detailed troubleshooting or when the tool output indicates an error.",
]
allowed_tools = ["run_alphafold3", "read_result_file"]

[[skills]]
