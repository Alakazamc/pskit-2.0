[[skills]]
id = "pdb_discovery"
name = "PDB Discovery"
description = """
Find relevant PDB entries from natural language.\
Fetch PDB infomation only when the user wants specific informations of certain entries.\
Don't chose this skill if the user wants to do further analysis in addition to retrieving information, such as nucleic acid binding pair annotation\
"""
workflow = [
    "Use search_pdb(query) to find candidate IDs.",
    "Use fetch_pdb_info(pdb_id) if necessary.",
]
allowed_tools = ["search_pdb", "fetch_pdb_info"]

[[skills]]
id = "web_search"
name = "Web Search"
description = """
Search the public web through SerpAPI for current external information, papers, tools, companies, documentation, or background context not covered by PSKit databases.\
Prefer RCSB, UniProt, and RNAcentral for authoritative molecular records. Use this skill when the user explicitly asks to search the web or asks for current/non-PSKit external context.\
"""
workflow = [
    "Use serpapi_search(query) with a focused query and a small num value.",
    "Summarize the results with source URLs and distinguish web evidence from PSKit tool outputs.",
    "Do not use web search as proof that a local computation was completed.",
]
allowed_tools = ["serpapi_search"]

[[skills]]
id = "structure_splitting"
name = "Structure Splitting"
description = "Inspect entry metadata and split complex/chains for downstream analysis readiness."
workflow = [
    "Use fetch_pdb_info(pdb_id) for metadata.",
    "Use download_pdb_file for user-provided PDB IDs or candidate IDs from search_pdb. If the required protein structure has already been downloaded in the historical dialog, do not download it again.",
    "Use split_complex or split_pdb_by_chain on downloaded/local structure.",
    "Summarize resulting files and recommended analysis entry points.",
]
allowed_tools = [
    "fetch_pdb_info",
    "download_pdb_file",
    "split_complex",
    "split_pdb_by_chain",
]

[[skills]]
id = "binding_pair_annotation"
name = "Protein Nucleic Acid Binding Pair Annotation"
description = "Annotate protein-nucleic-acid contact residue pairs."
workflow = [
    "Use search_pdb to find candidate IDs if user only provides natural language description and not PDB IDs.",
    "Use fetch_pdb_info if user not provide PDB IDs and ask for specific information on entries. Otherwise, do not fetch unnecessary metadata.",
    "Use download_pdb_file for user-provided PDB IDs or candidate IDs from search_pdb. If the required protein structure has already been downloaded in the historical dialog, do not download it again.",
    "Use annotate_binding_pairs with pdb_path and cutoff.",
    "Use read_result_file to read the whole result file and summarize key pair statistics and their distances for user interpretation.",
]
allowed_tools = [
    "search_pdb",
    "fetch_pdb_info",
    "download_pdb_file",
    "annotate_binding_pairs",
    "read_result_file",
]

[[skills]]
