name: New stack CI

on:
  push:
    branches: [main, codex/new-stack-baseline]
  pull_request:

permissions:
  contents: read

concurrency:
  group: new-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pskit_ci
          POSTGRES_PASSWORD: pskit-ci-disposable-only
          POSTGRES_DB: pskit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pskit_ci -d pskit_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://pskit_ci:pskit-ci-disposable-only@127.0.0.1:5432/pskit_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: new_backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_backend/pi/package-lock.json
      - name: Install Python dependencies with the runtime constraint
        run: python -m pip install -c new_backend/requirements.lock -e 'new_backend[dev]'
      - name: Install pinned Pi for backend protocol integration
        run: npm ci --prefix new_backend/pi
      - name: Lint, compile, unit and PostgreSQL 17 tests in isolated configuration
        run: python scripts/ci_new_stack.py backend --timeout 1800 --report-dir "${RUNNER_TEMP}/backend-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-stack-backend-results
          path: ${{ runner.temp }}/backend-results
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_frontend/package-lock.json
      - run: npm ci --prefix new_frontend
      - name: React types, lint, Vitest and build including Molstar verification
        run: python scripts/ci_new_stack.py frontend --timeout 720

  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_backend/pi/package-lock.json
      - run: npm ci --prefix new_backend/pi
      - name: Pinned Pi extension tests
        run: python scripts/ci_new_stack.py pi --timeout 300

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_frontend/package-lock.json
      - run: python -m pip install -c new_backend/requirements.lock -e 'new_backend[dev]'
      - run: npm ci --prefix new_frontend
      - name: Regenerate OpenAPI, Event, Compute and TypeScript and reject drift
        run: python scripts/check_new_stack_contracts.py
      - name: Confirm the checked-in contract tree is unchanged
        run: git diff --exit-code -- contracts new_frontend/src/api/generated new_frontend/src/api/generated-events.ts new_frontend/src/api/generated-compute.ts

  gateway-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fixed LiteLLM callback, PinCC and official Anthropic/OpenAI offline contrast
        run: >-
          timeout 180 docker run --rm --network none --read-only --tmpfs /tmp
          -e LITELLM_LOCAL_MODEL_COST_MAP=True -e PYTHONDONTWRITEBYTECODE=1
          -e PYTHONPATH=/compat -v "$PWD/infra/litellm:/compat:ro"
          --entrypoint python ghcr.io/berriai/litellm:v1.100.3
          /compat/test_provider_compat.py

  deployment-model-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, pi, contracts, gateway-protocol]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pskit_ci
          POSTGRES_PASSWORD: pskit-ci-disposable-only
          POSTGRES_DB: pskit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pskit_ci -d pskit_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://pskit_ci:pskit-ci-disposable-only@127.0.0.1:5432/pskit_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c new_backend/requirements.lock -e 'new_backend[dev]'
      - name: Synthetic local, Staging, production and OpenSandbox Compose models
        run: python scripts/ci_render_compose.py
      - name: Deployment and CI runner regression tests
        run: python scripts/ci_new_stack.py deployment --timeout 600
      - name: Lint new CI entrypoints
        run: python -m ruff check scripts/ci_new_stack.py scripts/ci_pg_guard.py scripts/ci_render_compose.py scripts/test_ci_new_stack.py
      - name: Build the current backend with the official new_backend context
        run: docker build -f deploy/agent/backend.Dockerfile -t pskit-agent-backend:ci new_backend
      - name: Check non-root user, Python/Pi versions, runtime imports and secret exclusion
        env:
          PSKIT_BACKEND_IMAGE: pskit-agent-backend:ci
        run: PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/image-pycache" python -m pytest -q -o cache_dir="${RUNNER_TEMP}/image-pytest-cache" deploy/agent/tests/test_backend_image.py
