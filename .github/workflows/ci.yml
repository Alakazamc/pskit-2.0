name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install uv==0.11.16 && uv sync --frozen --extra dev
      - name: Compile backend
        run: uv run python -m compileall app tests ../scripts
      - name: Lint and type check
        run: uv run ruff check app tests ../scripts/migrate_db.py && uv run mypy app ../scripts/migrate_db.py
      - name: Backend tests
        run: uv run pytest -q tests
      - name: Fresh database migration
        run: DATABASE_URL=sqlite:////tmp/pskit-ci.sqlite3 DATA_DIR=/tmp/pskit-ci ARTIFACT_DIR=/tmp/pskit-ci/artifacts uv run python ../scripts/migrate_db.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint -- --max-warnings 0
      - name: Test frontend
        run: npm test -- --run
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build delivery image
        run: docker build --tag pskit2:ci .
      - name: Check runtime imports and non-root user
        run: >-
          docker run --rm --entrypoint sh pskit2:ci -c
          'test "$(id -u)" = 10001 && python -c "import mcp, app.main"'
