# Private Staging site. The host firewall/WireGuard controls access to 10.9.8.1.
limit_req_zone $binary_remote_addr zone=pskit_staging_auth_mail:10m rate=6r/m;
limit_req_zone $server_name zone=pskit_staging_auth_mail_site:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=pskit_staging_auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pskit_staging_auth_verify:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pskit_staging_auth_connections:10m;
log_format pskit_staging_auth_security '$request_id $status $limit_req_status';

server {
    listen 10.9.8.1:18132;
    server_name _;
    root /var/www/agent-staging;
    index index.html;
    client_max_body_size 25m;
    limit_req_dry_run on;
    limit_req_status 429;
    error_page 429 = @pskit_staging_auth_rate_limited;
    access_log /var/log/nginx/agent-staging-auth-security.log pskit_staging_auth_security;

    location @pskit_staging_auth_rate_limited {
        internal;
        default_type application/json;
        add_header Retry-After "60" always;
        return 429 '{"detail":{"code":"AUTH_RATE_LIMITED"}}';
    }

    location ^~ /internal/ { return 404; }
    location = /auth/v1/verify {
        limit_req zone=pskit_staging_auth_verify burst=10 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18131;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
    }
    location ^~ /auth/v1/ { return 404; }
    location ^~ /rest/v1/ { return 404; }

    location = /api/v1/auth/signup {
        limit_req zone=pskit_staging_auth_mail burst=3 nodelay;
        limit_req zone=pskit_staging_auth_mail_site burst=10 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location = /api/v1/auth/password/recover {
        limit_req zone=pskit_staging_auth_mail burst=3 nodelay;
        limit_req zone=pskit_staging_auth_mail_site burst=10 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location = /api/v1/auth/upgrade/email {
        limit_req zone=pskit_staging_auth_mail burst=3 nodelay;
        limit_req zone=pskit_staging_auth_mail_site burst=10 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location = /api/v1/auth/login {
        limit_req zone=pskit_staging_auth_login burst=5 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location = /api/v1/auth/verify {
        limit_req zone=pskit_staging_auth_verify burst=10 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location = /api/v1/auth/upgrade/email/verify {
        limit_req zone=pskit_staging_auth_verify burst=10 nodelay;
        limit_conn pskit_staging_auth_connections 10;
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-PSKit-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
