# Layer after compose.yaml (and compose.local.yaml for the private model stub).
name: pskit-agent-cloud

services:
  backend:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE}
    build: !reset null
    env_file: !override
      - ${AGENT_BACKEND_ENV_FILE:-./cloud.backend.env}
    environment:
      RESEARCH_AGENT_MODE: live
      RESEARCH_AGENT_RUNTIME: pi
      RESEARCH_AGENT_AF3_EXECUTOR: callback
      RESEARCH_AGENT_MCP_EXECUTOR: disabled
      RESEARCH_AGENT_ANONYMOUS_ENABLED: "false"
      RESEARCH_AGENT_AUTH_COOKIE_SECURE: "true"
      RESEARCH_AGENT_GUEST_DAILY_GPU_MINUTES: "0"
      RESEARCH_AGENT_FRONTEND_URL: ${AGENT_PUBLIC_URL:-https://agent.bioailab.net}
      RESEARCH_AGENT_PUBLIC_API_URL: ${AGENT_PUBLIC_URL:-https://agent.bioailab.net}
      SUPABASE_PUBLIC_URL: ${AGENT_PUBLIC_URL:-https://agent.bioailab.net}
    ports: !override
      - "127.0.0.1:18088:8000"

  web:
    image: ${AGENT_WEB_IMAGE:?set AGENT_WEB_IMAGE}
    build: !reset null
    ports: !override
      - "127.0.0.1:18085:80"

  af3-callback-proxy:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE}
    volumes: !override
      - type: bind
        source: ${AGENT_AF3_PROXY_SCRIPT:-../../new_backend/scripts/af3_callback_proxy.py}
        target: /app/scripts/af3_callback_proxy.py
        read_only: true
      - type: bind
        source: ${AGENT_AF3_PROXY_KEY_FILE:-./cloud.proxy.env}
        target: /run/af3/callback.env
        read_only: true
    ports: !override
      - "127.0.0.1:18185:8080"

  # Private verification only. The production model gateway is configured
  # server-side in cloud.backend.env; this service is inactive by default.
  model-gateway-mock:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE}
    build: !reset null
    profiles: [private-test]
    command: ["python", "-u", "/mock/mock_model_gateway.py", "--host", "0.0.0.0", "--port", "8000"]
    volumes: !override
      - ./tests/mock_model_gateway.py:/mock/mock_model_gateway.py:ro
    networks:
      - app
    read_only: true
    cap_drop: !override [ALL]
    security_opt: !override [no-new-privileges:true]

  # Disabled in production until the isolated Staging smoke passes. Enable
  # explicitly with --profile mcp-receiver after reviewing its durable journal.
  mcp-receiver:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE}
    build: !reset null
    profiles: [mcp-receiver]
    command:
      - python
      - -u
      - /app/scripts/mcp_compute_receiver.py
      - --backend-url
      - http://backend:8000
      - --service-id
      - ${AGENT_MCP_SERVICE_ID:-coral-mcp}
      - --worker-id
      - ${AGENT_MCP_WORKER_ID:-coral-mcp-cloud-1}
      - --journal
      - /var/lib/pskit-mcp/journal.sqlite3
    env_file: !override
      - ${AGENT_MCP_RECEIVER_ENV_FILE:-./mcp.receiver.env}
    environment:
      PSKIT_MCP_BACKEND_URL: http://backend:8000
      PSKIT_MCP_SERVICE_ID: ${AGENT_MCP_SERVICE_ID:-coral-mcp}
    volumes:
      - mcp_receiver_data:/var/lib/pskit-mcp
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
      - mcp_egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: !override [ALL]
    security_opt: !override [no-new-privileges:true]
    restart: unless-stopped

networks:
  supabase:
    name: pskit-agent-supabase_default
  mcp_egress:
    internal: false

volumes:
  mcp_receiver_data:
    name: ${AGENT_MCP_RECEIVER_DATA_VOLUME:-pskit-agent-cloud_mcp_receiver_data}
