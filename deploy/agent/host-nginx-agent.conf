# Install only after DNS resolves and a valid certificate has been issued.
server {
    listen 80;
    server_name agent.bioailab.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agent.bioailab.net;
    ssl_certificate /etc/letsencrypt/live/agent.bioailab.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.bioailab.net/privkey.pem;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
