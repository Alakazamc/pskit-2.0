# Apply after compose.yaml, compose.cloud.yaml and compose.postgres.yaml.
name: pskit-agent-staging

services:
  backend:
    image: ${AGENT_BACKEND_IMAGE:?Set fixed staging backend image}
    environment: !override
      RESEARCH_AGENT_MODE: live
      RESEARCH_AGENT_RUNTIME: pi
      RESEARCH_AGENT_AF3_EXECUTOR: mock
      RESEARCH_AGENT_MCP_EXECUTOR: disabled
      RESEARCH_AGENT_ANONYMOUS_ENABLED: "false"
      RESEARCH_AGENT_AUTH_COOKIE_SECURE: "false"
      RESEARCH_AGENT_GUEST_DAILY_GPU_MINUTES: "0"
      RESEARCH_AGENT_MEMBER_DAILY_GPU_MINUTES: "0"
      RESEARCH_AGENT_PI_SESSION_DIR: /data/pi-sessions
      RESEARCH_AGENT_INTERNAL_API_URL: http://127.0.0.1:8000
      RESEARCH_AGENT_FRONTEND_URL: http://10.9.8.1:18132
      RESEARCH_AGENT_PUBLIC_API_URL: http://10.9.8.1:18132
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: http://10.9.8.1:18132
      MODEL_GATEWAY_BASE_URL: http://gateway:4000/v1
      MODEL_GATEWAY_KIND: litellm
    ports: !override
      - "127.0.0.1:18090:8000"

  af3-callback-proxy:
    profiles: [staging-disabled]
    ports: !override []

networks:
  supabase:
    name: ${SUPABASE_DOCKER_NETWORK:?Set staging Supabase network}

volumes:
  agent_data:
    name: ${AGENT_PG_DATA_VOLUME:?Set staging Agent data volume}
