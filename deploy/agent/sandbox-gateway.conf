pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64m;
    upstream sandbox_backend { server backend:8000; }
    server {
        listen 8080;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host backend;
        proxy_set_header Authorization $http_authorization;
        # Authorization is still verified by Python for every current Run.
        location = /internal/model/v1/chat/completions { proxy_pass http://sandbox_backend; }
        location = /internal/model/calls/preflight { proxy_pass http://sandbox_backend; }
        location ~ ^/internal/runs/[A-Za-z0-9_-]+/plan$ { proxy_pass http://sandbox_backend; }
        location ~ ^/internal/mcp/tools/[A-Za-z0-9_.-]+/invoke$ { proxy_pass http://sandbox_backend; }
        location = /internal/af3/jobs { proxy_pass http://sandbox_backend; }
        location ~ ^/internal/af3/jobs/[A-Za-z0-9_-]+$ { proxy_pass http://sandbox_backend; }
        location = /internal/compute/jobs { proxy_pass http://sandbox_backend; }
        location ~ ^/internal/compute/jobs/[A-Za-z0-9_-]+$ { proxy_pass http://sandbox_backend; }
        location / { return 403; }
    }
}
