name: pskit-agent-a6000

services:
  backend:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE to a fixed release tag}
    env_file:
      - ${AGENT_BACKEND_ENV_FILE:-./a6000.backend.env}
    environment:
      RESEARCH_AGENT_MODE: live
      RESEARCH_AGENT_RUNTIME: pi
      RESEARCH_AGENT_AF3_EXECUTOR: callback
      RESEARCH_AGENT_MCP_EXECUTOR: disabled
      RESEARCH_AGENT_ANONYMOUS_ENABLED: "false"
      RESEARCH_AGENT_AUTH_COOKIE_SECURE: "true"
      RESEARCH_AGENT_GUEST_DAILY_GPU_MINUTES: "0"
      RESEARCH_AGENT_MEMBER_DAILY_GPU_MINUTES: "0"
      RESEARCH_AGENT_DB_PATH: /data/agent.sqlite3
      RESEARCH_AGENT_PI_SESSION_DIR: /data/pi-sessions
      RESEARCH_AGENT_INTERNAL_API_URL: http://127.0.0.1:8000
      RESEARCH_AGENT_FRONTEND_URL: ${AGENT_PUBLIC_URL:-https://agent.bioailab.net}
      RESEARCH_AGENT_PUBLIC_API_URL: ${AGENT_PUBLIC_URL:-https://agent.bioailab.net}
      SUPABASE_URL: http://10.9.8.1:18130
      SUPABASE_PUBLIC_URL: ${AGENT_PUBLIC_URL:-https://agent.bioailab.net}
    volumes:
      - agent_data:/data
    ports:
      - "127.0.0.1:18089:8000"
    networks:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api-proxy:
    image: ${AGENT_API_PROXY_IMAGE:-nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284}
    user: "101:101"
    network_mode: host
    volumes:
      - ./api-a6000.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  af3-callback-proxy:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE to a fixed release tag}
    user: ${AGENT_PROXY_UID:-1000}:${AGENT_PROXY_GID:-1000}
    command:
      - python
      - /app/scripts/af3_callback_proxy.py
      - --env-file
      - /run/af3/callback.env
      - --worker-id
      - ${AGENT_AF3_WORKER_ID:-a6000-af3-cloud-1}
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --upstream-host
      - backend
      - --upstream-port
      - "8000"
    volumes:
      - type: bind
        source: ${AGENT_AF3_PROXY_KEY_FILE:-./a6000.backend.env}
        target: /run/af3/callback.env
        read_only: true
    ports:
      - "127.0.0.1:18185:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Private verification only. Production uses a configured model gateway.
  model-gateway-mock:
    image: ${AGENT_BACKEND_IMAGE:?set AGENT_BACKEND_IMAGE to a fixed release tag}
    profiles: [private-test]
    command: ["python", "-u", "/mock/mock_model_gateway.py", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./tests/mock_model_gateway.py:/mock/mock_model_gateway.py:ro
    networks:
      - app
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  app:
    internal: false

volumes:
  agent_data:
