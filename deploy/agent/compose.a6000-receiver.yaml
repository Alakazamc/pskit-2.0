# Start only after stopping pskit-af3-receiver-cloud-20261002 and checking
# its journal/owned jobs. The existing compute container keeps running.
name: pskit-agent-a6000-receiver

services:
  af3-receiver:
    image: af3_mar5_jhli_2026_0923:v1
    container_name: pskit-af3-receiver-local-20261002
    profiles: [cutover]
    user: "1006:1006"
    network_mode: host
    env_file:
      - ${AGENT_AF3_RECEIVER_ENV_FILE:-/data/jhli/pskit-af3-receiver-test-20261002/receiver.cloud.env}
    command:
      - /opt/af3_receiver.py
      - receive
      - --api-url
      - http://127.0.0.1:18185
      - --worker-id
      - a6000-af3-cloud-1
      - --spool-dir
      - /var/lib/af3-receiver
      - --gpu-memory-mb
      - "49140"
      - --poll-seconds
      - "5"
    volumes:
      - /data/jhli/pskit-af3-receiver-test-20261002/spool:/var/lib/af3-receiver
      - /data/jhli/pskit-af3-receiver-test-20261002/af3_receiver.py:/opt/af3_receiver.py:ro
    restart: unless-stopped
